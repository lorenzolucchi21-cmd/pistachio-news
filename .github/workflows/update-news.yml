name: Update pistachio news

on:
  schedule:
    - cron: '23 */3 * * *'
    - cron: '7 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'package*.json'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pistachio-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect news and build the site
        run: npm run build
      - name: Save the archive
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update pistachio news archive"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::warning::Could not save the archive this time. The page is still published."
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
